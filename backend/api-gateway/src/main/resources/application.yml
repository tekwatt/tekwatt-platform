spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
            - id: tenant-service
              uri: ${TENANT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/tenants/**
            - id: organization-service
              uri: ${ORGANIZATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/organizations/**
            - id: charger-service
              uri: ${CHARGER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/chargers/**
            - id: charging-session-service
              uri: ${CHARGING_SESSION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/charging-sessions/**

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tekwatt:
  gateway:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
