                - Path=/api/v1/telemetry/**
            - id: firmware-service
              uri: ${FIRMWARE_SERVICE_URL:http://localhost:8096}
              predicates:
                - Path=/api/v1/firmware/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8097}
