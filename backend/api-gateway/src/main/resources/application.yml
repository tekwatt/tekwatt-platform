            - id: openapi-ocpp
              uri: ${OCPP_GATEWAY_URL:http://localhost:8094}
              predicates:
                - Path=/openapi/ocpp/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-telemetry
