                - Path=/api/v1/audit-events/**
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8098}
              predicates:
                - Path=/api/v1/analytics/**
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URL:http://localhost:8099}
              predicates:
                - Path=/api/v1/reports/**
            - id: admin-service
              uri: ${ADMIN_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/api/v1/admin/**
            - id: openapi-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/openapi/auth/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: openapi-user
              uri: ${USER_SERVICE_URL:http://localhost:8082}
