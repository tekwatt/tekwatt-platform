spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**
            - id: tenant-service
              uri: ${TENANT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/tenants/**
            - id: organization-service
              uri: ${ORGANIZATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/organizations/**
            - id: charger-service
              uri: ${CHARGER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/chargers/**
            - id: connector-service
              uri: ${CONNECTOR_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/connectors/**
            - id: charging-session-service
              uri: ${CHARGING_SESSION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/charging-sessions/**
            - id: tariff-service
              uri: ${TARIFF_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/tariffs/**
            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/reservations/**
            - id: billing-service
              uri: ${BILLING_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/bills/**
            - id: invoice-service
              uri: ${INVOICE_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/invoices/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/v1/payments/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/v1/notifications/**
            - id: ocpp-gateway-api
              uri: ${OCPP_GATEWAY_URL:http://localhost:8094}
              predicates:
                - Path=/api/v1/ocpp/**
            - id: ocpp-gateway-websocket
              uri: ${OCPP_GATEWAY_WS_URL:ws://localhost:8094}
              predicates:
                - Path=/ocpp/**
            - id: telemetry-service
              uri: ${TELEMETRY_SERVICE_URL:http://localhost:8095}
              predicates:
                - Path=/api/v1/telemetry/**
            - id: firmware-service
              uri: ${FIRMWARE_SERVICE_URL:http://localhost:8096}
              predicates:
                - Path=/api/v1/firmware/**

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tekwatt:
  gateway:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
