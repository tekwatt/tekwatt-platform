            - id: openapi-admin
              uri: ${ADMIN_SERVICE_URL:http://localhost:8100}
              predicates:
                - Path=/openapi/admin/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tekwatt:
  gateway:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    persist-authorization: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: Authentication Service
        url: /openapi/auth/v3/api-docs
      - name: User Service
        url: /openapi/user/v3/api-docs
      - name: Charger Service
        url: /openapi/charger/v3/api-docs
      - name: Charging Session Service
        url: /openapi/charging-session/v3/api-docs
      - name: Tenant Service
        url: /openapi/tenant/v3/api-docs
      - name: Organization Service
        url: /openapi/organization/v3/api-docs
      - name: Connector Service
        url: /openapi/connector/v3/api-docs
      - name: Tariff Service
        url: /openapi/tariff/v3/api-docs
      - name: Reservation Service
        url: /openapi/reservation/v3/api-docs
      - name: Billing Service
        url: /openapi/billing/v3/api-docs
      - name: Invoice Service
        url: /openapi/invoice/v3/api-docs
      - name: Payment Service
        url: /openapi/payment/v3/api-docs
      - name: Notification Service
        url: /openapi/notification/v3/api-docs
      - name: OCPP Gateway
        url: /openapi/ocpp/v3/api-docs
      - name: Telemetry Service
        url: /openapi/telemetry/v3/api-docs
      - name: Firmware Service
        url: /openapi/firmware/v3/api-docs
      - name: Audit Service
        url: /openapi/audit/v3/api-docs
      - name: Analytics Service
        url: /openapi/analytics/v3/api-docs
      - name: Reporting Service
        url: /openapi/reporting/v3/api-docs
      - name: Admin Service
