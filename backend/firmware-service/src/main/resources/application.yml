spring:
  application.name: firmware-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_firmware?serverTimezone=UTC}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
server.port: ${SERVER_PORT:8096}
management.endpoints.web.exposure.include: health,info
tekwatt.ocpp.gateway-url: ${OCPP_GATEWAY_URL:http://localhost:8094}
