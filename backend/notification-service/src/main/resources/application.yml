spring:
  application.name: notification-service
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_notifications?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
server.port: ${SERVER_PORT:8093}
management.endpoints.web.exposure.include: health,info
tekwatt:
  services:
    admin: ${ADMIN_SERVICE_URL:http://localhost:8100}
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
  email:
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
  sms:
    credentials-encryption-key: ${SMS_PROVIDER_ENCRYPTION_KEY:}
    provider-admin-emails: ${SMS_PROVIDER_ADMIN_EMAILS:}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      message-variable: ${MSG91_MESSAGE_VARIABLE:message}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
