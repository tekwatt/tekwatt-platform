spring:
  application.name: notification-service
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_notifications?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
server.port: ${SERVER_PORT:8093}
management.endpoints.web.exposure.include: health,info
tekwatt:
  email:
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
  sms:
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      message-variable: ${MSG91_MESSAGE_VARIABLE:message}
