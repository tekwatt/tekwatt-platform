spring:
  application.name: support-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_support?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
server.port: ${SERVER_PORT:8101}
management.endpoints.web.exposure.include: health,info
