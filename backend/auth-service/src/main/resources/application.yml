spring:
  application:
    name: auth-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_auth?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${SERVER_PORT:8081}
management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
tekwatt:
  services:
    admin: ${ADMIN_SERVICE_URL:http://localhost:8100}
  auth:
    msg91:
      widget-id: ${MSG91_OTP_WIDGET_ID:}
      widget-token: ${MSG91_OTP_WIDGET_TOKEN:}
      server-auth-key: ${MSG91_OTP_SERVER_AUTH_KEY:}
    reset-from: ${SMTP_FROM:}
    smtp-encryption-key: ${SMTP_CREDENTIALS_ENCRYPTION_KEY:}
    smtp-admin-emails: ${SMTP_ADMIN_EMAILS:}
    jwt:
      secret: ${JWT_SECRET:local-development-secret-must-be-at-least-thirty-two-characters}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
