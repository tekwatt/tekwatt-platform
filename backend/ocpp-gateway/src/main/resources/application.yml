spring:
  application.name: ocpp-gateway
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_ocpp?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
server.port: ${SERVER_PORT:8094}
tekwatt.ocpp.shared-key: ${OCPP_SHARED_KEY:}
management.endpoints.web.exposure.include: health,info
tekwatt.firmware.service-url: ${FIRMWARE_SERVICE_URL:http://localhost:8096}
tekwatt.services:
  user: ${USER_SERVICE_URL:http://localhost:8082}
  charger: ${CHARGER_SERVICE_URL:http://localhost:8083}
  session: ${CHARGING_SESSION_SERVICE_URL:http://localhost:8084}
  connector: ${CONNECTOR_SERVICE_URL:http://localhost:8087}
  telemetry: ${TELEMETRY_SERVICE_URL:http://localhost:8095}
