spring:
  application:
    name: charging-session-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_charging_sessions?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${SERVER_PORT:8084}
tekwatt:
  services:
    tariff: ${TARIFF_SERVICE_URL:http://localhost:8088}
    billing: ${BILLING_SERVICE_URL:http://localhost:8090}
    invoice: ${INVOICE_SERVICE_URL:http://localhost:8091}
    user: ${USER_SERVICE_URL:http://localhost:8082}
    charger: ${CHARGER_SERVICE_URL:http://localhost:8083}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8093}
  charging-sms:
    enabled: ${CHARGING_SMS_ENABLED:true}
    poll-ms: ${CHARGING_SMS_POLL_MS:5000}
  billing:
    enabled: ${AUTO_SESSION_BILLING_ENABLED:true}
    sms-enabled: ${PAYMENT_SMS_ENABLED:false}
    portal-url: ${CUSTOMER_PORTAL_URL:}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
