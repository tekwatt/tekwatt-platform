spring:
  application:
    name: charging-session-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tekwatt_charging_sessions}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${SERVER_PORT:8084}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
