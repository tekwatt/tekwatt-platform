spring:
  application:
    name: user-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tekwatt_users?serverTimezone=UTC}
    username: ${DATABASE_USERNAME:tekwatt}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8082}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
